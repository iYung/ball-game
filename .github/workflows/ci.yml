name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install LÖVE 11.5
        run: |
          wget -q https://github.com/love2d/love/releases/download/11.5/love-11.5-x86_64.AppImage
          chmod +x love-11.5-x86_64.AppImage
          ./love-11.5-x86_64.AppImage --appimage-extract >/dev/null
          sudo ln -s "$PWD/squashfs-root/bin/love" /usr/local/bin/love

      - name: Run tests
        run: love . --headless --coverage
